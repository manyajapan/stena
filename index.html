  :root {
    --bg: #B53ECC;
    --fg: #FFFFFF;
    --font: 'Bebas Neue Bold', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .wall {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  .strip {
    display: flex;
    align-items: center;
    gap: 2.2vw;
    padding: 2.4vh 3vw 1.4vh;
  }

  .qr {
    flex: 0 0 auto;
    width: 8.4vw;
    min-width: 104px;
    aspect-ratio: 1;
    padding: 9px;
    border-radius: 14px;
    background: #FFFFFF;
  }

  .qr svg, .qr img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .question {
    margin: 0;
    max-width: 26ch;
    font-size: 2.5vw;
    line-height: 1.1;
  }

  .counter {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.95vw;
    white-space: nowrap;
    opacity: 0.9;
  }

  .counter b {
    font-family: var(--font);
    font-size: 1.9vw;
    font-weight: 400;
  }

  .arena {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .word {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    font-family: var(--font);
    font-weight: 400;
    line-height: 1;
    color: var(--fg);
    transform-origin: center;
    will-change: transform;
    transition: transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .word > span { display: inline-block; }

  .word.is-new > span {
    animation: word-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .word.is-bump > span {
    animation: word-bump 780ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .word i {
    margin-left: 0.16em;
    font-family: var(--mono);
    font-size: 0.36em;
    font-style: normal;
    vertical-align: super;
    opacity: 0.68;
  }

  @keyframes word-in {
    from { opacity: 0; transform: translate3d(var(--ox, 0px), var(--oy, 0px), 0) scale(0.52); }
    55%  { opacity: 1; }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  @keyframes word-bump {
    0%   { transform: scale(1); }
    38%  { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  .note {
    position: absolute;
    left: 22px;
    bottom: 18px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  @media (prefers-reduced-motion: reduce) {
    .word { transition: none; }
    .word.is-new > span, .word.is-bump > span { animation: none; }
  }
</style>

<script>
(function () {
  var CFG = window.WALL_CONFIG;

  document.documentElement.style.setProperty('--bg', CFG.colors.background);
  document.documentElement.style.setProperty('--fg', CFG.colors.text);

  var arena = document.getElementById('arena');
  var qrBox = document.getElementById('qr');
  var questionEl = document.getElementById('question');
  var totalEl = document.getElementById('total');
  var totalWordsEl = document.getElementById('totalWords');
  var noteEl = document.getElementById('note');

  /* ============ код для входа ============ */

  function drawQr() {
    if (CFG.customQr) {
      qrBox.innerHTML = '<img src="' + CFG.customQr + '" alt="Код для входа">';
      return;
    }
    var rows = window.WALL_QR || [];
    var n = rows.length;
    if (!n) { qrBox.innerHTML = ''; return; }

    /* Белое поле вокруг кода — четыре квадратика, как требует стандарт. */
    var quiet = 4;
    var total = n + quiet * 2;
    var cells = '';
    for (var y = 0; y < n; y += 1) {
      var row = rows[y];
      for (var x = 0; x < n; x += 1) {
        if (row.charAt(x) !== '1') continue;
        cells += '<rect x="' + (x + quiet) + '" y="' + (y + quiet)
               + '" width="1" height="1" rx="0.2" fill="' + CFG.colors.qrModules + '"/>';
      }
    }
    qrBox.innerHTML = '<svg viewBox="0 0 ' + total + ' ' + total
      + '" role="img" aria-label="Код для входа">'
      + '<rect width="' + total + '" height="' + total + '" fill="#ffffff"/>'
      + cells + '</svg>';
  }

  drawQr();

  /* ============ связь с базой ============ */

  function rpc(name, args, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 8000);
    return fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: CFG.supabaseKey,
        Authorization: 'Bearer ' + CFG.supabaseKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {}),
      signal: ctl.signal
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        return { net: false, data: data };
      });
    }).catch(function () {
      return { net: true, data: null };
    }).then(function (r) {
      clearTimeout(timer);
      return r;
    });
  }

  function plural(n) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'слово';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'слова';
    return 'слов';
  }

  function note(text) {
    if (!text) { noteEl.hidden = true; return; }
    noteEl.textContent = text;
    noteEl.hidden = false;
  }

  /* ============ размер текста ============ */

  var measureCanvas = document.createElement('canvas');
  var measureCtx = measureCanvas.getContext('2d');
  var MEASURE_FONT = "'Bebas Neue Bold', 'Oswald', 'Arial Narrow', sans-serif";

  function textWidth(text, size) {
    if (!measureCtx) return text.length * size * 0.45;
    measureCtx.font = size + 'px ' + MEASURE_FONT;
    return measureCtx.measureText(text).width;
  }

  /* ============ область, внутри которой живут слова ============
     Сейчас это круг. Когда понадобится другая фигура — логотип,
     квадрат, облако — меняется только эта функция: она говорит,
     где слову можно стоять и где его граница.                     */

  function makeRegion(w, h) {
    return {
      cx: w / 2,
      cy: h / 2,
      R: Math.min(w * 0.78, h * 0.94) / 2
    };
  }

  /* Насколько далеко угол слова от центра области. */
  function cornerDist(box, region) {
    var ex = Math.abs(box.x - region.cx) + box.hw;
    var ey = Math.abs(box.y - region.cy) + box.hh;
    return Math.sqrt(ex * ex + ey * ey);
  }

  /* ============ раскладка ============
     Слова расставляются по кругу равномерно, как семечки в
     подсолнухе: каждое следующее чуть дальше от центра и под новым
     углом. Затем они мягко расталкиваются, чтобы не налезать друг
     на друга. Когда слов становится много, вся стена одинаково
     ужимается — размер по-прежнему один для всех.              */

  function jitter(norm, size) {
    var h = 2166136261;
    for (var i = 0; i < norm.length; i += 1) {
      h ^= norm.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var angle = (((h >>> 0) % 1000) / 1000) * Math.PI * 2;
    return { x: Math.cos(angle) * size, y: Math.sin(angle) * size };
  }

  function layoutWords(words, w, h, baseSize) {
    var region = makeRegion(w, h);
    var n = words.length;
    if (!n) return [];

    /* Порядок постоянный — по алфавиту. Поэтому повтор слова ничего
       не сдвигает: двигаются только те, кого задел новичок. */
    var ordered = words.slice().sort(function (a, b) {
      if (a.norm < b.norm) return -1;
      if (a.norm > b.norm) return 1;
      return 0;
    });

    var fill = n <= 18 ? 1 : Math.max(0.5, Math.sqrt(18 / n));
    var size = baseSize * fill;

    var golden = Math.PI * (3 - Math.sqrt(5));
    var boxes = [];

    for (var i = 0; i < n; i += 1) {
      var word = ordered[i];
      var t = (i + 0.55) / n;
      var rr = region.R * 0.74 * Math.sqrt(t);
      var a = i * golden;
      boxes.push({
        norm: word.norm,
        display: word.display,
        count: word.count,
        hw: textWidth(word.display, size) / 2,
        hh: size * 0.53,
        x: region.cx + Math.cos(a) * rr,
        y: region.cy + Math.sin(a) * rr
      });
    }

    var steps = n > 90 ? 70 : 140;
    var push = 0.5;

    for (var s = 0; s < steps; s += 1) {
      for (var p = 0; p < boxes.length; p += 1) {
        var A = boxes[p];
        for (var q = p + 1; q < boxes.length; q += 1) {
          var B = boxes[q];
          var dx = B.x - A.x;
          var dy = B.y - A.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 0.01) { dx = 1; dy = 0; dist = 0.01; }
          var ux = dx / dist;
          var uy = dy / dist;
          var reach = (A.hw + B.hw) * Math.abs(ux)
                    + (A.hh + B.hh) * Math.abs(uy) + 7;
          var overlap = reach - dist;
          if (overlap <= 0) continue;
          var m = overlap * push / 2;
          A.x -= ux * m; A.y -= uy * m;
          B.x += ux * m; B.y += uy * m;
        }
      }

      for (var k = 0; k < boxes.length; k += 1) {
        var C = boxes[k];
        var d = cornerDist(C, region);
        if (d > region.R) {
          var f = region.R / d;
          C.x = region.cx + (C.x - region.cx) * f;
          C.y = region.cy + (C.y - region.cy) * f;
        }
      }
    }

    return boxes.map(function (b) {
      return {
        norm: b.norm, display: b.display, count: b.count,
        x: b.x, y: b.y, size: size
      };
    });
  }

  /* ============ отрисовка ============ */

  var seen = {};
  var nodes = {};

  function esc(text) {
    return String(text).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function render(words) {
    var w = arena.clientWidth;
    var h = arena.clientHeight;
    if (w < 80 || h < 80) return;

    var size = CFG.wordSize * Math.min(1.7, Math.max(0.5, h / 900));
    var placed = layoutWords(words, w, h, size);

    var fresh = {}, bumped = {};
    for (var i = 0; i < words.length; i += 1) {
      var before = seen[words[i].norm];
      if (before === undefined) fresh[words[i].norm] = true;
      else if (words[i].count > before) bumped[words[i].norm] = true;
    }
    seen = {};
    for (var j = 0; j < words.length; j += 1) seen[words[j].norm] = words[j].count;

    var alive = {};
    for (var p = 0; p < placed.length; p += 1) {
      var item = placed[p];
      alive[item.norm] = true;

      var node = nodes[item.norm];
      if (!node) {
        node = document.createElement('div');
        node.className = 'word';
        node.appendChild(document.createElement('span'));
        var off = jitter(item.norm, 220);
        node.style.setProperty('--ox', off.x + 'px');
        node.style.setProperty('--oy', off.y + 'px');
        arena.appendChild(node);
        nodes[item.norm] = node;
      }

      var inner = node.firstChild;
      if (inner.getAttribute('data-count') !== String(item.count)) {
        inner.setAttribute('data-count', String(item.count));
        inner.innerHTML = item.count > 1
          ? esc(item.display) + '<i>' + item.count + '</i>'
          : esc(item.display);
      }

      node.style.fontSize = item.size + 'px';
      node.style.transform = 'translate3d(' + item.x.toFixed(1) + 'px, '
        + item.y.toFixed(1) + 'px, 0) translate(-50%, -50%)';

      if (fresh[item.norm]) {
        node.classList.add('is-new');
        setTimeout((function (n) {
          return function () { n.classList.remove('is-new'); };
        })(node), 750);
      }
      if (bumped[item.norm]) {
        node.classList.add('is-bump');
        setTimeout((function (n) {
          return function () { n.classList.remove('is-bump'); };
        })(node), 800);
      }
    }

    for (var norm in nodes) {
      if (!alive[norm]) {
        nodes[norm].parentNode.removeChild(nodes[norm]);
        delete nodes[norm];
      }
    }
  }

  /* ============ обновление ============ */

  var frozen = false;
  var lastWords = [];
  var lastSignature = '';

  function signature(words) {
    var parts = [];
    for (var i = 0; i < words.length; i += 1) {
      parts.push(words[i].norm + ':' + words[i].count);
    }
    return parts.join('|');
  }

  function refresh() {
    rpc('wall_state', {}, 7000).then(function (result) {
      if (result.net || !result.data) { note('нет связи с базой'); return; }
      note('');

      var data = result.data;
      questionEl.textContent = data.question || '';
      totalEl.textContent = String(data.total || 0);
      totalWordsEl.textContent = plural(data.total || 0);

      frozen = !!data.frozen;
      lastWords = data.words || [];

      /* Пересобираем картину только когда список слов изменился,
         иначе стена дёргалась бы каждую секунду. */
      var sig = signature(lastWords);
      if (!frozen && sig !== lastSignature) {
        lastSignature = sig;
        render(lastWords);
      }
    });
  }

  window.__wallReady = true;

  rpc('wall_reset_on_load', {}, 7000).then(function () {
    refresh();
  });

  setInterval(refresh, 1000);

  window.addEventListener('resize', function () {
    lastSignature = '';
    if (!frozen) render(lastWords);
  });
})();
</script>
</body>
</html>
