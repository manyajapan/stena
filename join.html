  :root {
    --bg: #B53ECC;
    --fg: #FFFFFF;
    --card: rgba(0, 0, 0, 0.22);
    --line: rgba(255, 255, 255, 0.45);
    --font: 'Bebas Neue Bold', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 560px;
    margin: 0 auto;
    padding: 8vh 22px 6vh;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .mark {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.08;
  }

  .hint {
    margin: 0;
    font-size: 17px;
    opacity: 0.85;
    line-height: 1.35;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  input[type="text"] {
    width: 100%;
    padding: 18px 18px 14px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--fg);
    font-family: var(--font);
    font-size: 26px;
  }

  input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.55); }

  input[type="text"]:focus-visible {
    outline: 3px solid var(--fg);
    outline-offset: 2px;
  }

  button {
    width: 100%;
    padding: 18px 20px 14px;
    border: 0;
    border-radius: 14px;
    background: var(--fg);
    color: var(--bg);
    font-family: var(--font);
    font-size: 24px;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active { opacity: 0.85; }

  .status {
    font-size: 16px;
    line-height: 1.3;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
  }

  .done-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 54px;
    height: 54px;
    border-radius: 999px;
    background: var(--fg);
    color: var(--bg);
    font-size: 30px;
  }

  .ver {
    margin-top: 4vh;
    font-family: var(--mono);
    font-size: 11px;
    opacity: 0.45;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- Форма написана обычной разметкой, поэтому видна сразу.
     onsubmit="return false" не даёт странице перезагружаться при ошибке. -->
<main class="sheet" id="sheet">

  <span class="mark">Одно слово</span>

  <h1 id="question">Опишите сегодняшний день одним словом</h1>

  <p class="hint">Коротко, одним словом. Оно тут же появится на большом экране.</p>

  <form id="form" onsubmit="return false">
    <input id="word" type="text" autocomplete="off" maxlength="48"
           enterkeyhint="send" placeholder="например, энергия" aria-label="Ваше слово">
    <span class="status" id="status" hidden></span>
    <button id="send" type="submit">Отправить</button>
  </form>

  <span class="ver" id="ver">сборка 5</span>
</main>

<script>
/* ============================================================
   Настройки. Всё, что нужно менять, лежит здесь и больше нигде.
   ============================================================ */

window.WALL_CONFIG = {
  /* Адрес базы и публичный ключ. Публичный ключ можно показывать:
     он по замыслу лежит внутри страницы, поэтому он и здесь.
     Секретный ключ сюда вставлять НЕЛЬЗЯ никогда. */
  supabaseUrl: "https://xtsvpftkmpmjfhixvvpb.supabase.co",
  supabaseKey: "sb_publishable_e9Nk2GwkGzwKp0UYWPPMqg_45k9AUYu",

  /* Адрес сайта, на котором будут лежать эти страницы.
     Из него собирается QR-код: адрес сайта плюс join.html.
     Если сайт переедет, поменяйте строку и QR пересоберётся. */
  siteUrl: "https://storied-bonbon-f39dc2.netlify.app",

  /* Своя картинка с QR-кодом. Пусто означает: код рисуется сам
     из адреса выше. Если хотите свою картинку, впишите её адрес. */
  customQr: "",

  /* Фирменные цвета. */
  colors: {
    background: "#B53ECC",
    text: "#FFFFFF",
    qrModules: "#B53ECC",
  },

  /* Размер слов на стене. Один для всех, одинаковый всегда. */
  wordSize: 64,
};

</script>

<!-- Этот блок срабатывает всегда, даже если основной код упадёт. -->
<script>
(function () {
  function say(text) {
    var el = document.getElementById('status');
    if (!el) return;
    el.textContent = text;
    el.hidden = false;
  }
  window.addEventListener('error', function (e) {
    say('Ошибка на странице: ' + (e.message || 'неизвестно'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    say('Ошибка: ' + ((e.reason && e.reason.message) || String(e.reason)));
  });
  setTimeout(function () {
    if (!window.__wallReady) {
      say('Основной код страницы не загрузился. Сообщите организатору.');
    }
  }, 5000);
})();
</script>

<script>
(function () {
  var CFG = window.WALL_CONFIG;

  document.documentElement.style.setProperty('--bg', CFG.colors.background);
  document.documentElement.style.setProperty('--fg', CFG.colors.text);

  var sheet = document.getElementById('sheet');
  var form = document.getElementById('form');
  var input = document.getElementById('word');
  var send = document.getElementById('send');
  var questionEl = document.getElementById('question');
  var statusEl = document.getElementById('status');

  var MESSAGES = {
    empty: 'Напишите хотя бы одно слово',
    too_long: 'Слишком длинно, уложитесь в пару слов',
    too_many_words: 'Хватит одного слова или короткой фразы',
    blocked: 'Такое слово не пройдёт, напишите, пожалуйста, иначе',
    closed: 'Приём слов сейчас остановлен',
    rate: 'Вы уже написали, дайте другим пару секунд'
  };

  function status(text) {
    if (!text) { statusEl.hidden = true; return; }
    statusEl.textContent = text;
    statusEl.hidden = false;
  }

  /* Запрос к базе обычным способом, без библиотек.
     Ограничен по времени, поэтому страница не может зависнуть. */
  function rpc(name, args, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 9000);
    return fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: CFG.supabaseKey,
        Authorization: 'Bearer ' + CFG.supabaseKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {}),
      signal: ctl.signal
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        return { net: false, status: res.status, data: data };
      });
    }).catch(function () {
      return { net: true, status: 0, data: null };
    }).then(function (result) {
      clearTimeout(timer);
      return result;
    });
  }

  function deviceId() {
    try {
      var saved = localStorage.getItem('wall-device');
      if (saved) return saved;
      var bytes = new Uint8Array(12);
      crypto.getRandomValues(bytes);
      var fresh = Array.prototype.map
        .call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); })
        .join('');
      localStorage.setItem('wall-device', fresh);
      return fresh;
    } catch (e) {
      return 'device-fallback';
    }
  }

  var sending = false;

  function drawDone() {
    sheet.innerHTML = '<span class="done-mark">✓</span>'
      + '<h1>Принято</h1>'
      + '<p class="hint">Смотрите на большой экран, слово уже там.</p>'
      + '<button id="again" type="button">Написать ещё слово</button>';
    document.getElementById('again').addEventListener('click', function () {
      location.reload();
    });
  }

  function sendWord() {
    if (sending) return;

    var value = input.value.trim();
    if (!value) {
      status(MESSAGES.empty);
      input.focus();
      return;
    }

    sending = true;
    send.textContent = 'Отправляем';
    status('');

    rpc('submit_word', { p_word: value, p_device: deviceId() }, 12000)
      .then(function (result) {
        sending = false;
        send.textContent = 'Отправить';

        if (result.net) {
          status('Нет связи с базой, попробуйте ещё раз');
          return;
        }
        if (!result.data || !result.data.ok) {
          status(MESSAGES[result.data && result.data.code] || 'Не получилось отправить');
          return;
        }
        drawDone();
      });
  }

  function loadQuestion() {
    rpc('wall_state', {}, 8000).then(function (result) {
      if (result.net) {
        status('Нет связи с базой. Сообщите организатору.');
        return;
      }
      if (!result.data) {
        status('Ошибка связи с базой.');
        return;
      }
      questionEl.textContent = result.data.question || 'Одно слово';
      var open = !!result.data.accept;
      send.textContent = open ? 'Отправить' : 'Приём закрыт';
      if (!open) status('Приём слов сейчас остановлен');
      document.title = result.data.question || 'Одно слово';
    });
  }

  /* Отправка двумя путями: обычным нажатием и отдельно касанием.
     Второй нужен из-за особенности iPhone: когда открыта клавиатура,
     первое нажатие по кнопке иногда пропадает. */
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    sendWord();
  });

  send.addEventListener('touchend', function (event) {
    event.preventDefault();
    sendWord();
  }, { passive: false });

  input.addEventListener('input', function () {
    if (!sending) status('');
  });

  window.__wallReady = true;
  loadQuestion();
})();
</script>
</body>
</html>
