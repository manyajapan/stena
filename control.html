  :root {
    --bg: #B53ECC;
    --fg: #FFFFFF;
    --card: rgba(0, 0, 0, 0.22);
    --line: rgba(255, 255, 255, 0.45);
    --font: 'Bebas Neue Bold', 'Oswald', 'Arial Narrow', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 6vh 20px 12vh;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  h1 { margin: 0; font-size: 32px; font-weight: 400; }
  h2 { margin: 8px 0 0; font-size: 22px; font-weight: 400; opacity: 0.9; }

  .mark {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  p { margin: 0; font-size: 16px; line-height: 1.35; opacity: 0.9; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }

  .toggle {
    padding: 13px 18px 10px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--fg);
    font-family: var(--font);
    font-size: 19px;
    cursor: pointer;
  }

  .toggle[data-on="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .field { display: flex; flex-direction: column; gap: 10px; }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 16px 16px 12px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--fg);
    font-family: var(--font);
    font-size: 22px;
  }

  input:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  button.primary {
    padding: 16px 20px 12px;
    border: 0;
    border-radius: 12px;
    background: var(--fg);
    color: var(--bg);
    font-family: var(--font);
    font-size: 21px;
    cursor: pointer;
  }

  button:disabled { opacity: 0.5; }

  button.mini {
    padding: 8px 12px 6px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    cursor: pointer;
  }

  .list { display: flex; flex-direction: column; border-top: 2px solid var(--line); }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 2px;
    border-bottom: 2px solid var(--line);
  }

  .item b { font-weight: 400; font-size: 22px; }
  .item .c { font-family: var(--mono); font-size: 12px; opacity: 0.8; }
  .item .grow { flex: 1 1 auto; }
  .item[data-hidden="true"] b { text-decoration: line-through; opacity: 0.6; }
</style>
</head>
<body>

<main class="wrap" id="app"></main>

<script>
/* ============================================================
   Настройки. Всё, что нужно менять, лежит здесь и больше нигде.
   ============================================================ */

window.WALL_CONFIG = {
  /* Адрес базы и публичный ключ. Публичный ключ можно показывать:
     он по замыслу лежит внутри страницы, поэтому он и здесь.
     Секретный ключ сюда вставлять НЕЛЬЗЯ никогда. */
  supabaseUrl: "https://xtsvpftkmpmjfhixvvpb.supabase.co",
  supabaseKey: "sb_publishable_e9Nk2GwkGzwKp0UYWPPMqg_45k9AUYu",

  /* Адрес сайта, на котором будут лежать эти страницы.
     Из него собирается QR-код: адрес сайта плюс join.html.
     Если сайт переедет, поменяйте строку и QR пересоберётся. */
  siteUrl: "https://manyajapan.github.io/stena",

  /* Своя картинка с QR-кодом. Пусто означает: код рисуется сам
     из адреса выше. Если хотите свою картинку, впишите её адрес. */
  customQr: "",

  /* Фирменные цвета. */
  colors: {
    background: "#B53ECC",
    text: "#FFFFFF",
    qrModules: "#B53ECC",
  },

  /* Размер слов на стене. Один для всех, одинаковый всегда. */
  wordSize: 64,
};

</script>

<script>
(function () {
  var CFG = window.WALL_CONFIG;

  document.documentElement.style.setProperty('--bg', CFG.colors.background);
  document.documentElement.style.setProperty('--fg', CFG.colors.text);

  var app = document.getElementById('app');

  var pin = '';
  var state = null;
  var message = '';
  var messageGood = false;
  var busy = false;

  function esc(text) {
    return String(text).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function joinLink() {
    return CFG.siteUrl.replace(/\/$/, '') + '/join.html';
  }

  function rpc(name, args, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 9000);
    return fetch(CFG.supabaseUrl + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: CFG.supabaseKey,
        Authorization: 'Bearer ' + CFG.supabaseKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {}),
      signal: ctl.signal
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        return { net: false, data: data };
      });
    }).catch(function () {
      return { net: true, data: null };
    }).then(function (r) {
      clearTimeout(timer);
      return r;
    });
  }

  /* 'ok' — вошли, 'bad' — неверный код, 'net' — нет связи */
  function load(code) {
    return rpc('control_state', { p_pin: code }, 9000).then(function (result) {
      if (result.net || !result.data) return 'net';
      if (!result.data.ok) return 'bad';
      state = result.data.state;
      return 'ok';
    });
  }

  function drawLogin() {
    app.innerHTML = '<span class="mark">Пульт зала</span>'
      + '<h1>Введите код</h1>'
      + '<p>Этот экран только для того, кто ведёт стену. Код по умолчанию 2026, смените его после первого входа.</p>'
      + '<form class="field" id="login" onsubmit="return false">'
      + '<input id="pin" type="password" autocomplete="off">'
      + '<span class="error" id="msg"' + (message ? '' : ' hidden') + '>' + esc(message) + '</span>'
      + '<button class="primary" id="go" type="submit"' + (busy ? ' disabled' : '') + '>'
      + (busy ? 'Проверяем' : 'Войти') + '</button></form>';

    document.getElementById('pin').focus();
    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
      var value = document.getElementById('pin').value.trim();
      if (value.length < 4) return;
      busy = true;
      drawLogin();
      load(value).then(function (result) {
        busy = false;
        if (result === 'ok') { pin = value; message = ''; draw(); return; }
        message = result === 'net' ? 'Нет связи с базой' : 'Код не подошёл';
        drawLogin();
      });
    });
  }

  function act(action, value) {
    busy = true;
    rpc('control_action', { p_pin: pin, p_action: action, p_value: value || null }, 9000)
      .then(function (result) {
        busy = false;
        if (result.net) {
          message = 'Нет связи с базой';
          messageGood = false;
          draw();
          return;
        }
        if (!result.data || !result.data.ok) {
          message = (result.data && result.data.code === 'bad_pin')
            ? 'Код сбросился, войдите заново' : 'Не выполнено';
          messageGood = false;
          if (result.data && result.data.code === 'bad_pin') { state = null; drawLogin(); return; }
          draw();
          return;
        }
        message = 'Готово';
        messageGood = true;
        load(pin).then(draw);
      });
  }

  function draw() {
    var words = (state && state.words) || [];
    var shown = words.filter(function (w) { return !w.hidden; });
    var hidden = words.filter(function (w) { return w.hidden; });

    app.innerHTML = '<span class="mark">Пульт зала</span>'
      + '<h1>' + esc(state.question) + '</h1>'
      + '<span class="' + (messageGood ? 'good' : 'error') + '" id="msg"'
      + (message ? '' : ' hidden') + '>' + esc(message) + '</span>'

      + '<div class="row">'
      + '<button class="toggle" data-on="' + state.accept + '" id="accept">'
      + (state.accept ? 'Приём открыт' : 'Приём закрыт') + '</button>'
      + '<button class="toggle" data-on="' + state.frozen + '" id="freeze">'
      + (state.frozen ? 'Стена на паузе' : 'Стена идёт') + '</button>'
      + '<button class="toggle" data-on="' + state.resetOnLoad + '" id="reset-on-load">'
      + (state.resetOnLoad ? 'Сброс при перезагрузке: вкл' : 'Сброс при перезагрузке: выкл')
      + '</button></div>'
      + '<p>Пока сброс включён, каждое открытие стены очищает её. Это для репетиций,'
      + ' перед показом выключите.</p>'

      + '<div class="field"><p>Вопрос на экране</p>'
      + '<input id="question" type="text" value="' + esc(state.question) + '" maxlength="160">'
      + '<button class="primary" id="save-question">Сохранить вопрос</button></div>'

      + '<p>Всего слов: <b>' + state.total + '</b>, отдельных ответов: ' + shown.length + '</p>'

      + '<div class="list">'
      + (shown.map(function (w) {
          return '<div class="item" data-hidden="false"><b>' + esc(w.display) + '</b>'
            + '<span class="c">' + w.count + '</span><span class="grow"></span>'
            + '<button class="mini" data-hide="' + esc(w.norm) + '">убрать</button></div>';
        }).join('') || '<p>Пока пусто. Это нормально до первого слова.</p>')
      + '</div>'

      + (hidden.length
        ? '<h2>Убрано</h2><div class="list">'
          + hidden.map(function (w) {
              return '<div class="item" data-hidden="true"><b>' + esc(w.display) + '</b>'
                + '<span class="c">' + w.count + '</span><span class="grow"></span>'
                + '<button class="mini" data-unhide="' + esc(w.norm) + '">вернуть</button></div>';
            }).join('')
          + '</div>'
        : '')

      + '<div class="field"><p>Стоп-лист</p>'
      + '<p>Слова, которые не должны попасть на экран. Достаточно начала слова,'
      + ' правило сработает на все формы. Список пуст, пока вы его не заполните.</p>'
      + '<input id="stop" type="text" maxlength="32" placeholder="начало слова">'
      + '<button class="primary" id="add-stop">Добавить в стоп-лист</button></div>'
      + '<div class="row">'
      + ((state.banned || []).map(function (t) {
          return '<button class="mini" data-unban="' + esc(t) + '">' + esc(t) + ' ✕</button>';
        }).join('') || '<p>Стоп-лист пуст</p>')
      + '</div>'

      + '<div class="field"><p>Ссылка для гостей</p><p><b>' + esc(joinLink()) + '</b></p>'
      + '<p>Своя картинка с кодом: положите файл рядом со страницами и впишите его'
      + ' адрес в настройку customQr. Пусто — код рисуется сам.</p></div>'

      + '<div class="row"><button class="mini" id="clear">очистить стену</button></div>'

      + '<div class="field"><p>Сменить код пульта</p>'
      + '<input id="new-pin" type="text" maxlength="24" placeholder="новый код">'
      + '<button class="primary" id="save-pin">Сменить код</button></div>';

    var on = function (id, handler) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', handler);
    };

    on('accept', function () { act(state.accept ? 'accept-off' : 'accept-on'); });
    on('freeze', function () { act(state.frozen ? 'freeze-off' : 'freeze-on'); });
    on('reset-on-load', function () {
      act(state.resetOnLoad ? 'reset-on-load-off' : 'reset-on-load-on');
    });
    on('save-question', function () {
      var value = document.getElementById('question').value.trim();
      if (value) act('question', value);
    });
    on('add-stop', function () {
      var value = document.getElementById('stop').value.trim();
      if (value.length >= 3) act('ban-add', value);
    });
    on('clear', function () {
      if (confirm('Очистить стену полностью? Слова будут удалены.')) act('reset');
    });
    on('save-pin', function () {
      var value = document.getElementById('new-pin').value.trim();
      if (value.length < 4) return;
      busy = true;
      rpc('control_action', { p_pin: pin, p_action: 'set-pin', p_value: value }, 9000)
        .then(function (result) {
          busy = false;
          if (result.data && result.data.ok) {
            pin = value;
            message = 'Код сменён';
            messageGood = true;
            load(pin).then(draw);
          } else {
            message = result.net ? 'Нет связи с базой' : 'Не выполнено';
            messageGood = false;
            draw();
          }
        });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-hide]'), function (el) {
      el.addEventListener('click', function () { act('hide', el.getAttribute('data-hide')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-unhide]'), function (el) {
      el.addEventListener('click', function () { act('unhide', el.getAttribute('data-unhide')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-unban]'), function (el) {
      el.addEventListener('click', function () { act('ban-remove', el.getAttribute('data-unban')); });
    });
  }

  /* Пока пульт открыт, тихо подтягиваем свежие данные.
     Если вы что-то печатаете, обновление пропускается. */
  setInterval(function () {
    if (!state || document.hidden || busy) return;
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    load(pin).then(function (result) { if (result === 'ok') draw(); });
  }, 3000);

  window.__wallReady = true;
  drawLogin();
})();
</script>
</body>
</html>
